<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MERICA Sovereign v9.0 NUI</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <!--
      Transparent overlay body — all HUD panels render inside the React root.
      The body and html are transparent so game world shows through.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
      #root { width: 100%; height: 100%; }
    </style>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
